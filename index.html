<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Momentum — To-Do List</title>

<!-- I moved all the CSS out into its own file and link it here -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="bg-blobs">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="blob blob-c"></div>
    <div class="blob blob-d"></div>
  </div>
  <div class="bg-dots"></div>

  <span class="sparkle" style="top:12%; left:8%;">✨</span>
  <span class="sparkle" style="top:22%; right:10%; animation-delay:1.2s;">✦</span>
  <span class="sparkle" style="bottom:16%; left:12%; animation-delay:2.4s;">✨</span>
  <span class="sparkle" style="bottom:26%; right:8%; animation-delay:0.6s;">✦</span>

  <div class="app-shell">
    <div class="app-header">
      <div class="brand">
        <div class="brand-icon">✓</div>
        <div>
          <h1>Momentum</h1>
          <p class="tagline">Small steps, tracked beautifully.</p>
        </div>
      </div>
      <div class="mood" id="moodEmoji">😴</div>
    </div>

    <div class="card-wrapper" id="cardWrapper">
      <div class="card">

        <div class="progress-section">
          <svg class="progress-ring" viewBox="0 0 64 64">
            <defs>
              <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#7c5cff"/>
                <stop offset="100%" stop-color="#34e0a1"/>
              </linearGradient>
            </defs>
            <circle class="ring-bg" cx="32" cy="32" r="26"></circle>
            <circle class="ring-fill" id="ringFill" cx="32" cy="32" r="26"></circle>
          </svg>
          <div class="progress-info">
            <div class="progress-percent" id="progressPercent">0%</div>
            <div class="progress-text" id="progressText">0 of 0 complete</div>
          </div>
        </div>

        <div class="input-row">
          <input type="text" id="taskInput" placeholder="What do you want to get done?">
          <button id="addBtn">＋ Add</button>
        </div>

        <ul id="taskList"></ul>
        <p class="empty-state" id="emptyState">Nothing here yet — add your first task above.</p>

      </div>
    </div>
  </div>

  <div class="celebration-overlay" id="celebrationOverlay">
    <div class="celebration-modal">
      <div class="burst-ring" style="animation-delay:0s;"></div>
      <div class="burst-ring" style="animation-delay:0.25s;"></div>
      <div class="burst-ring" style="animation-delay:0.5s;"></div>
      <div class="trophy">🏆</div>
      <h2>All tasks complete!</h2>
      <p id="celebrationSubtext">You crossed off every task. Nice work.</p>
      <button id="dismissCelebration">Keep going</button>
    </div>
  </div>

  <div id="confettiLayer"></div>

  <!-- I put my JavaScript in its own file and load it at the end of body -->
  <script src="js/main.js"></script>

</body>
</html>
